name: Daily arXiv Digest

on:
  push:
    branches: [main]
    paths:
      - 'digests/**'
  schedule:
    # Runs at 05:00 UTC every weekday (06:00 CET / 07:00 CEST)
    - cron: '0 5 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if today digest already exists'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install poppler-utils (for pdftotext fallback)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate daily digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python3 arxiv_digest.py --force
          else
            python3 arxiv_digest.py
          fi

      - name: Commit and push updated digests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if ! git diff --cached --quiet; then
            git commit -m "Update arXiv digest ($(date -u +'%Y-%m-%d'))"
            git pull --rebase
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './digests'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
